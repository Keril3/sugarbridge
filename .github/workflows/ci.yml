# Runs on every push and pull request: unit tests, Android Lint and the build.
# No passwords or keys needed: the tests talk to a fake LibreLinkUp.
name: CI
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"   # gradle/gradle-daemon-jvm.properties requires JDK 25
          cache: gradle
      - run: chmod +x gradlew
      - name: Unit tests, Lint and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Reports if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
