# Runs on every push and pull request: unit tests, Android Lint and the build.
# No passwords or keys needed: the tests talk to a fake LibreLinkUp.
name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: "25"   # gradle/gradle-daemon-jvm.properties requires JDK 25
          cache: gradle
      - run: chmod +x gradlew
      - name: Unit tests, Lint and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Reports if something failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: reports
          path: app/build/reports/
