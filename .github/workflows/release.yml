# A new release: git tag v1.3.0 && git push origin v1.3.0
# Builds a signed APK and publishes it to GitHub Releases as SugarBridge.apk,
# so the "latest version" link in the README always points to the newest file.
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # to create the release and attach the APK

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - run: chmod +x gradlew

      - name: Signing key from the repository secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KEYSTORE_BASE64 secret is missing, see the README section \"Releasing a new version\""
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Tests and the release build
        env:
          SUGARBRIDGE_KEYSTORE: ${{ runner.temp }}/release.jks
          SUGARBRIDGE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SUGARBRIDGE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SUGARBRIDGE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease -Psugarbridge.version="${GITHUB_REF_NAME#v}"

      - name: Release file
        run: cp app/build/outputs/apk/release/app-release.apk SugarBridge.apk

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" SugarBridge.apk \
            --title "SugarBridge ${GITHUB_REF_NAME#v}" --notes-file <(sed -n "/^## ${GITHUB_REF_NAME#v}/,/^## /p" CHANGELOG.md | sed '1d;$d') \
            || gh release upload "$GITHUB_REF_NAME" SugarBridge.apk --clobber
