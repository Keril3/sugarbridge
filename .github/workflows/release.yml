# Выпуск новой версии: git tag v1.2.0 && git push origin v1.2.0
# Собирает подписанный APK и публикует его в GitHub Releases как SugarBridge.apk —
# ссылка «последняя версия» в README всегда ведёт на свежий файл.
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # чтобы создать выпуск и приложить APK

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - run: chmod +x gradlew

      - name: Ключ подписи из секретов репозитория
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Нет секрета KEYSTORE_BASE64 — см. README, раздел «Выпуск новой версии»"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Тесты и сборка release
        env:
          SUGARBRIDGE_KEYSTORE: ${{ runner.temp }}/release.jks
          SUGARBRIDGE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SUGARBRIDGE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SUGARBRIDGE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease -Psugarbridge.version="${GITHUB_REF_NAME#v}"

      - name: Файлы для выпуска
        run: |
          cp app/build/outputs/apk/release/app-release.apk SugarBridge.apk
          sha256sum SugarBridge.apk > SugarBridge.apk.sha256

      - name: Выпуск на GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" SugarBridge.apk SugarBridge.apk.sha256 \
            --title "SugarBridge ${GITHUB_REF_NAME#v}" --notes-file <(sed -n "/^## ${GITHUB_REF_NAME#v}/,/^## /p" CHANGELOG.md | sed '1d;$d') \
            || gh release upload "$GITHUB_REF_NAME" SugarBridge.apk SugarBridge.apk.sha256 --clobber
